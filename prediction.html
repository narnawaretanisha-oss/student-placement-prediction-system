<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Placement Prediction</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: linear-gradient(135deg, #f3f6fa, #e9f0f6);
            color: #293b4f;
        }


        .navbar {
            background: rgba(255, 255, 255, 0.96);

            padding: 20px;

            text-align: center;

            box-shadow: 0 3px 15px rgba(63, 96, 124, 0.10);

            border-bottom: 1px solid #e3eaf0;
        }


        .navbar h2 {
            color: #3f607c;

            letter-spacing: 0.5px;

            transition: 0.3s ease;
        }


        .navbar h2:hover {
            color: #55748e;

            letter-spacing: 1px;
        }


        .container {
            min-height: 88vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .box {
            width: 430px;

            background: rgba(255, 255, 255, 0.97);

            padding: 40px;

            border-radius: 18px;

            border: 1px solid #e2eaf1;

            box-shadow: 0 12px 35px rgba(63, 96, 124, 0.12);

            transition: all 0.35s ease;
        }


        .box:hover {
            transform: translateY(-6px);

            box-shadow: 0 18px 40px rgba(63, 96, 124, 0.17);
        }


        h1 {
            text-align: center;

            color: #3f607c;

            margin-bottom: 8px;

            font-size: 28px;

            line-height: 1.3;

            transition: 0.3s ease;
        }


        h1:hover {
            color: #55748e;
        }


        .welcome {
            text-align: center;

            color: #788695;

            margin-bottom: 25px;

            font-size: 15px;
        }


        label {
            display: block;

            margin-top: 15px;

            margin-bottom: 7px;

            font-weight: bold;

            color: #4d6073;

            font-size: 14px;
        }


        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #d3dce5;

            border-radius: 8px;

            outline: none;

            background: #fafcfe;

            color: #293b4f;

            font-size: 15px;

            transition: all 0.3s ease;
        }


        input:hover {
            border-color: #9eb2c3;

            background: white;
        }


        input:focus {
            border-color: #6d8ba4;

            background: white;

            box-shadow: 0 0 0 3px rgba(109, 139, 164, 0.13);
        }


        button {
            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #6d8ba4;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            box-shadow: 0 5px 12px rgba(63, 96, 124, 0.15);

            transition: all 0.3s ease;
        }


        button:hover {
            background: #55748e;

            transform: translateY(-3px);

            box-shadow: 0 8px 18px rgba(63, 96, 124, 0.22);
        }


        button:active {
            transform: translateY(0);

            box-shadow: 0 3px 8px rgba(63, 96, 124, 0.15);
        }


    </style>

</head>


<body>


    <div class="navbar">

        <h2>Student Placement Portal</h2>

    </div>


    <div class="container">

        <div class="box">

            <h1>
                Student Placement Prediction
            </h1>


            <p class="welcome">
                Welcome, {{ student_name }}
            </p>


            <form
                method="POST"
                action="{% url 'result' %}"
            >

                {% csrf_token %}


                <label>
                    CGPA
                </label>

                <input
                    type="number"
                    step="any"
                    name="cgpa"
                    required
                >


                <label>
                    IQ
                </label>

                <input
                    type="number"
                    step="any"
                    name="iq"
                    required
                >


                <label>
                    Profile Score
                </label>

                <input
                    type="number"
                    step="any"
                    name="profile_score"
                    required
                >


                <button type="submit">
                    Submit
                </button>


            </form>

        </div>

    </div>


</body>

</html>
